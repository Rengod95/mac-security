name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: macos-latest # arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
  prebuild:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest # arm64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run prebuild
      - run: tar -czf mac-security-${{ github.ref_name }}-darwin-arm64.tar.gz prebuilds
      - uses: softprops/action-gh-release@v2
        with:
          files: mac-security-${{ github.ref_name }}-darwin-arm64.tar.gz
